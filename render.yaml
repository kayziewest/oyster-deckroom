services:
  - type: web
    name: oyster-deckroom
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: deckroom-data
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: NOTIFY_EMAIL
        value: jude@oysterskin.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
